replicaCount: 1

image:
  repository: bhanurajeev/quarkus-devops-demo
  tag: "dev-local"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  APP_ENVIRONMENT: "dev"
  GREETING_MESSAGE: "Hello from DEV (Helm)"