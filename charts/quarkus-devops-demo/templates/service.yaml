apiVersion: v1
kind: Service
metadata:
  name: quarkus-devops-demo
  labels:
    app: quarkus-devops-demo
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: quarkus-devops-demo