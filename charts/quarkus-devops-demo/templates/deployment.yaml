apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-devops-demo
  labels:
    app: quarkus-devops-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: quarkus-devops-demo
  template:
    metadata:
      labels:
        app: quarkus-devops-demo
    spec:
      containers:
        - name: quarkus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: {{ .Values.env.APP_ENVIRONMENT | quote }}
            - name: GREETING_MESSAGE
              value: {{ .Values.env.GREETING_MESSAGE | quote }}
            - name: APP_ENVIRONMENT
              value: {{ .Values.env.APP_ENVIRONMENT | quote }}
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}